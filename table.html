<!DOCTYPE html>
<html>
<head>
  <title>Transpose Table</title>

  <style>
    table {
      border-collapse: collapse;
      margin: 50px auto;
      font-family: Arial, sans-serif;
    }

    th, td {
      border: 1px solid #999;
      padding: 8px 15px;
      text-align: center;
    }

    th {
      background-color: #e5e5e5;
    }

    .name {
      background-color: pink;
    }

    .age {
      background-color: lightblue;
    }

    .gender {
      background-color: #f5b5b5;
    }
  </style>
</head>

<body>

<table>

 
  <tr>
    
    <th rowspan="2">Field</th>

    
    <th colspan="4">People</th>
  </tr>

  
  <tr>
    <th>Prabha</th>
    <th>Sammy</th>
    <th>Akila</th>
    <th>Gayathri</th>
  </tr>


  <tr>
    <th>No</th>
    <td>1</td>
    <td>2</td>
    <td>3</td>
    <td>4</td>
  </tr>

  <tr>
    <th class="name">Name</th>
    <td class="name">Prabha</td>
    <td class="name">Sammy</td>
    <td class="name">Akila</td>
    <td class="name">Gayathri</td>
  </tr>

  <tr>
    <th class="age">Age</th>
    <td class="age">21</td>
    <td class="age">46</td>
    <td class="age">43</td>
    <td class="age">20</td>
  </tr>

  <tr>
    <th class="gender">Gender</th>
    <td>Male</td>
    <td>Male</td>
    <td>Female</td>
    <td>Female</td>
  </tr>

</table>

</body>
</html>
