<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .nav {
        border: 3px dotted black;
        width: 700px;
        padding: 5px;
        display: flex;
        text-align: center;
        justify-content: center;
        margin-bottom: 30px;
      }
      .head {
        border: 3px dotted black;
        width: 700px;
        padding: 5px;
        display: flex;
        text-align: center;
        justify-content: center;
      }
      .left-content {
        border: 3px dotted black;
        width: 650px;
        padding: 50px;
        display: flex;
        text-align: center;
        justify-content: center;
        margin-top: 30px;
      }
      .section-title {
        border: 3px dotted black;
        width: 30%;
        padding: 5px;
        display: flex;
        text-align: center;
        justify-content: center;
      }
      .sub-block {
        border: 1.5px dotted black;
        width: 50px;
        padding: 5px;
        margin-top: 80px;
        margin-right: 200px;
      }
      .sub-block1 {
        border: 2px dotted black;
        margin-bottom: 20px;
      }
      .sub-block2 {
        border: 2px dotted black;
      }
    </style>
  </head>
  <body>
    <nav class="nav">NAVIGATION</nav>
    <header class="head">HEADER</header>
    <div class="main-container">
      <section class="left-content">
        <div class="section-title">left-content</div>

        <div class="sub-block1">SUB1</div>
        <div class="sub-block2">SUB2</div>
      </section>
      <aside class="right-content">
        <div class="section-title">right-content</div>
        <div class="sub-content">sub-content</div>
      </aside>
    </div>
    <footer class="foot">footer</footer>
  </body>
</html>
