<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduTech</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background: #f9f9f9;
    }

    .main-box {
      max-width: 1200px;
      width: 90%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 40px 20px;
      background: #fff;
      border-radius: 8px;
    }

    .content {
      flex: 1 1 60%;
    }

    .content h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #333;
    }

    .content h2 {
      font-size: 1.4rem;
      margin-bottom: 15px;
      color: #555;
    }

    .content p {
      margin-bottom: 20px;
      color: #666;
    }

    .buttons {
      margin: 15px 0;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      margin-right: 10px;
      background: #007bff;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s ease;
    }
    .btn1{
          display: inline-block;
      padding: 10px 20px;
      margin-right: 10px;
      background: #f0f3f5;
      color: #1682e7;
      text-decoration: none;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s ease;

    }

    
    .btn:hover {
      background: #0056b3;
    }

    .btn i {
      margin-right: 8px;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .stats div {
      
      padding: 10px 15px;
      text-align: center;
      color: #007bff;
      font-weight: bold;
    }

    .image {
      flex: 1 1 40%;
      text-align: center;
    }

    .image img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    @media (max-width: 991px) {
      .main-box {
        flex-direction: column;
        width: 90%;
        text-align: center;
      }

      .content, .image {
        flex: 1 1 100%;
      }

      .buttons {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 767px) {
      .main-box {
        flex-direction: column;
        width: 95%;
        padding: 20px;
      }

      .content h1 {
        font-size: 1.6rem;
      }

      .content h2 {
        font-size: 1.2rem;
      }

      .btn {
        margin: 8px 0;
        width: 100%;
        text-align: center;
      }
      .btn1{
         margin: 8px 0;
        width: 100%;
        text-align: center;

      }

      .stats {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="main-box">
    <div class="content">
      <h1 style="color: #007bff;font-size: 15px;">Welcome to EduTech</h1>
      <h2>Learn Today, Build Tomorrow</h2>
      <p>Join thousands of students and develop real-world skills with expert-led courses.</p>
      <div class="buttons">
        <button class="btn">Get Started <i class="fa-solid fa-arrow-right"></i></button>
        <button class="btn1"><i class="fa-solid fa-circle-play"></i> Watch Video</button>
      </div>
      <div class="stats">
        <div>10K+ <br><span style="color: #333;">Students</span></div>
        <div>50+ <br><span style="color: #333;">Courses</span></div>
        <div>95% <br><span style="color: #333;"> Success Rate</span></div>
      </div>
    </div>
    <div class="image">
      <img src="./java123/assets/edulaptop.jpeg" alt="Online Learning">
    </div>
  </div>
</body>
</html>
