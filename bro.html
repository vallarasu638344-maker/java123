<!DOCTYPE html>

<html>
    
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student  Calculator</title>
  <style>
    h2 {
      color:blue;
    }
    .container {
      margin: auto;
      background: whitesmoke;
      padding: 20px;
      border-radius: 8px;
    }
    label {
      display: inline-block;
      width: 100px;
      margin: 8px 0;
    }
    input {
      padding: 6px;
      margin-bottom: 10px;
      border: 1px solid rgb(15, 15, 15);
      border-radius: 50px;
    }
    button {
      background-color: red;
      color: white;
      padding: 15px;
      border: none;
      border-radius: 50px;
     
    }

  </style>
  
</head>
<body> 
  <h2>CALCULATOR</h2>
  <label>UserName</label>
  <input type="text" id="username"><br>

  <label>Tamil</label>
  <input type="number" id="tamil"><br>

  <label>English</label>
  <input type="number" id="english"><br>

  <label>Maths</label>
  <input type="number" id="maths"><br>

  <label>Science</label>
  <input type="number" id="science"><br>

  <label>Social</label>
  <input type="number" id="social"><br>

  <button onclick="calculate()">calc</button>

  <div id="result"></div>

  <script>
    function calculate() {
      let name = document.getElementById("username").value;
      let tamil = Number(document.getElementById("tamil").value);
      let english = Number(document.getElementById("english").value);
      let maths = Number(document.getElementById("maths").value);
      let science = Number(document.getElementById("science").value);
      let social = Number(document.getElementById("social").value);

      let total = tamil + english + maths + science + social;
      let average = total / 5;
      let percentage = (total / 500) * 100;

      let grade = "";
      if (percentage >= 90)
       grade = "A+";
      else if (percentage >= 75) 
      grade = "A";
      else if (percentage >= 60) 
      grade = "B";
      else if (percentage >= 50)
       grade = "C";
      else grade = "F";

     
      document.getElementById("result").innerHTML =
        "Name: " + name + "<br>" +
        "Total Marks: " + total + "<br>" +
        "Average Marks: " + average + "<br>" +
        "Percentage: " + percentage + "%<br>" 
        "Grade: " + grade;
    }
  </script>
</body>
</html>
