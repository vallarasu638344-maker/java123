<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product list index</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      width: 250px;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 180px;
    }

    .card-body {
      padding: 15px;
    }

    .card-body h3 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .card-body p {
      font-size: 14px;
      color: #555;
      margin-bottom: 8px;
    }

    .price {
      font-weight: bold;
      color: #2a9d8f;
    }

    .btn {
      display: inline-block;
      padding: 8px 12px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn:hover {
      background: #0056b3;
    }
  </style>
  <body>
    <div class="container" id="product-list"></div>

    <script>
      fetch("products.json")
        .then((response) => response.json())
        .then((data) => {
          let output = "";
          for (let i = 0; i < data.products.length; i++) {
            let product = data.products[i];
            output += `
            <div class="card">
              <img src="${product.image}" alt="${product.name}">
              <div class="card-body">
                <h3>${product.name}</h3>
                <p>${product.description}</p>
                <p class="price">₹${product.price}</p>
                <button class="btn">Buy Now</button>
              </div>
            </div>
          `;
          }
          document.getElementById("product-list").innerHTML = output;
        });
    </script>
  </body>
</html>
