<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0px;
      padding: 0px;
      box-sizing: border-box;
    }
    .form {
      background-color: green;
      height: 70vh;
      width: 400px;
      margin: 35px auto;
      background: linear-gradient(to bottom,#002252,#063d4b,#00613a);
    }
    img {
      border-radius: 50%;
      margin-top: 40px;
      margin-left: 150px;
      height: 5vh;
      width: 100px;
    }

    h2 {
      font-size: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: whitesmoke;
    }

    .form2 {
      margin-left: 70px;
      color: white;
    }
    .button {
      padding: 10px 30px;
      margin-top: 30px;
      background-color: yellow;
      color: rgb(238, 13, 13);
      border-radius: 20px 20px;
    }
    .button:hover {
      background-color: black;
      transition: all 0.5 linear 0s;
    }
  </style>

  <body>
    <div class="form">
      <img src="./css/birdsparrot.jpg" />
      <h2>on-site enquiries form</h2>
      <form action="get"></form>
      <div class="form2">
        <label for="">Name*</label><br />
        <input type="text" /><br />
        <label for="">where are you*</label><br />
        <input type="text" /><br />
        <label for="">street adress</label><br />
        <input type="text" /><br />
        <label for="">address line 2</label><br />
        <label for="">city</label><br />
        <input type="text" /><br />
        <button type="" class="button">submit</button>
      </div>
    </div>
  </body>
</html>
