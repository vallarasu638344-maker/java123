<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Responsive Cards</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    /* font-family:Arial, sans-serif; */
}

body{
    background:#f2f2f2;
    padding:10px;
}

.main-container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:20px;
}

.banner img{
    width:100%;
    height:300px;
    object-fit:cover;
    border-radius:15px;
}

.image{
    display:flex;
    gap:15px;
    margin-top:15px;
}

.card1{
    flex:1;
    background:#f5f5f5;
    padding:20px;
    border-radius:15px;
}
.card2{
     flex:1;
    background:#f5f5f5;
    padding:20px;
    border-radius:15px;
}

.card h2{
    color:#0b3558;
    margin-bottom:10px;
}

.card p{
    color:#555;
    line-height:1.5;
    margin-bottom:15px;
}

.btn{
    display:inline-block;
    background:#0b3558;
    color:white;
    text-decoration:none;
    padding:10px 20px;
    border-radius:10px;
}


@media(min-width:769px){

    .main-container{
        max-width:1200px;
        padding:30px;
        display:flex;
        gap:25px;
    }

    .banner{
        width:33%;
    }

    .banner img{
        height:400px;
    }

    .image{
        width:67%;
        margin-top:0;
        gap:25px;
    }

    .card1{
        height:400px;
        padding:30px;
        display:flex;
        flex-direction:column;
        justify-content:center;
    }
    .card2{
        height:400px;
        padding:30px;
        display:flex;
        flex-direction:column;
        justify-content:center;
    }

}

@media(max-width:750px){

    .banner img{
        height:220px;
    }

    .image{
        flex-direction:column;
    }

}

@media(max-width:500px){

    body{
        padding:5px;
    }

    .main-container{
        padding:10px;
        background-color: aqua;
    }

    .banner img{
        height:160px;
    }

    .card1{
        padding:15px;
    }
    .card2{
        padding: 15px;
    }

    .card1 h2{
        font-size:20px;
    }
    .card2 h2{
        
        font-size:20px;
    }
    .btn{
        width:100%;
        text-align:center;
    }

}

</style>
</head>

<body>

<div class="main-container">

    <div class="banner">
        <img src="./assets/latop.jpeg" alt="">
    </div>

    <div class="image">

        <div class="card1">

            <h2>Web Development</h2>

            <p>
                Learn HTML, CSS and JavaScript with practical projects
                and responsive website development.
            </p>

              <button class="btn">Explore</button>
         

        </div>

        <div class="card2">

            <h2>Responsive Design</h2>

            <p>
                Create websites that automatically adjust their layout
                according to desktop, tablet and mobile screens.
            </p>
               <a href="" class="btn">Explore</a>
         

        </div>

    </div>

</div>

</body>
</html>
