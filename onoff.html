<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .container{
        position: absolute;
        margin: 100px;
        width: 150px;
        height: 100px;
        background-color: red;
        margin-top: 300px;

    } 
    



</style>
<body>
    <div class="container">
        <img src="./assets/onlight.jpg" alt="" id="img">


    </div>
    <p style="text-align: center;"> <button onclick="on()">on</button><button onclick="off()">off</button></p>
    <script>
        function on(){
            let img= document.getElementById("img");
            img src="./assets/onlight.jpg";
           
        }
        function off()
        {
            let img=document.getElementById("img");
            img src="./assets/offlight.jpg";
        }
    </script>
    
</body>
</html>
